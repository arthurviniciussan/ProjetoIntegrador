<div class="cliente-modal-backdrop" (click)="fechar.emit()">
  <section class="cliente-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-excluir-cliente" tabindex="-1" (click)="$event.stopPropagation()">
    <h2 id="titulo-excluir-cliente">Excluir cliente</h2>
    <p>Tem certeza de que deseja excluir <strong>{{ cliente().nome }}</strong>? Esta ação não pode ser desfeita.</p>
    <div class="cliente-modal-acoes">
      <button class="button button-secondary" type="button" (click)="fechar.emit()">Cancelar</button>
      <button class="button button-danger-solid" type="button" (click)="confirmar.emit()">Excluir cliente</button>
    </div>
  </section>
</div>
